# Builds the website in 03Develop/website and publishes it to GitHub Pages
# every time changes are pushed to the main branch.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: 03Develop/website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03Develop/website/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: 03Develop/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
